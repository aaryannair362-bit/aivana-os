<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIVANA OPD Scribe - Doctor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0e17; color: #e2e8f0; min-height: 100vh; }
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; background: #111827; border-bottom: 1px solid #1e293b; flex-wrap: wrap; gap: 10px; }
        .app-header h1 { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, #22d3ee, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .header-right span { font-size: 12px; color: #94a3b8; }
        .app-main { display: flex; flex: 1; }
        .sidebar { width: 180px; background: #0f172a; border-right: 1px solid #1e293b; padding: 12px 0; }
        .sidebar button { display: block; width: 100%; padding: 12px 20px; background: transparent; border: none; color: #94a3b8; font-size: 13px; font-weight: 500; text-align: left; cursor: pointer; transition: all 0.2s; }
        .sidebar button:hover { background: #1e293b; color: #e2e8f0; }
        .sidebar button.active { background: #1e293b; color: #22d3ee; border-right: 2px solid #22d3ee; }
        .content { flex: 1; padding: 20px; overflow-y: auto; max-height: calc(100vh - 80px); }
        .view { display: none; }
        .view.active { display: block; }
        .control-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .control-bar label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; }
        .control-bar select { padding: 6px 10px; background: #0f172a; border: 1px solid #1e293b; border-radius: 6px; color: #e2e8f0; font-size: 12px; outline: none; }
        .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .preset-btn { padding: 6px 14px; background: #1e293b; border: 1px solid #334155; border-radius: 20px; color: #94a3b8; font-size: 12px; cursor: pointer; transition: all 0.2s; }
        .preset-btn:hover { background: #2d3748; color: #e2e8f0; border-color: #06b6d4; }
        .btn-primary { padding: 8px 20px; background: linear-gradient(135deg, #06b6d4, #0891b2); border: none; border-radius: 8px; color: white; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { padding: 6px 14px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 12px; cursor: pointer; }
        .btn-secondary:hover { background: #2d3748; }
        .btn-outline { padding: 6px 14px; background: transparent; border: 1px solid #334155; border-radius: 8px; color: #94a3b8; font-size: 12px; cursor: pointer; }
        .btn-outline:hover { border-color: #64748b; color: #e2e8f0; }
        .btn-danger { padding: 6px 14px; background: #dc2626; border: none; border-radius: 8px; color: white; cursor: pointer; }
        #transcript-input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; color: #e2e8f0; font-family: monospace; font-size: 13px; resize: vertical; min-height: 80px; outline: none; margin-bottom: 8px; }
        #transcript-input:focus { border-color: #06b6d4; }
        #transcript-input:disabled { opacity: 0.6; }
        #analysis-status { font-size: 13px; color: #22d3ee; min-height: 24px; margin: 8px 0; }
        #analysis-status.error { color: #f87171; }
        #analysis-status.success { color: #34d399; }
        #mic-status { font-size: 12px; padding: 4px 12px; border-radius: 12px; display: inline-block; margin-left: 8px; }
        #mic-status.idle { background: #1e293b; color: #94a3b8; }
        #mic-status.listening { background: #dc2626; color: white; animation: pulse 1s infinite; }
        #mic-status.transcribing { background: #f59e0b; color: #0a0e17; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .prescription-draft { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; margin-top: 16px; }
        .prescription-draft h2 { font-size: 18px; margin-bottom: 12px; }
        .draft-fields > div { margin-bottom: 12px; }
        .draft-fields label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 4px; }
        .draft-fields textarea, .draft-fields input { width: 100%; padding: 8px 12px; background: #0a0e17; border: 1px solid #1e293b; border-radius: 6px; color: #e2e8f0; font-size: 13px; outline: none; }
        .draft-fields textarea:focus, .draft-fields input:focus { border-color: #06b6d4; }
        .draft-fields textarea { min-height: 50px; resize: vertical; font-family: inherit; }
        .medication-item, .lab-item { display: flex; align-items: center; gap: 8px; padding: 4px 10px; background: #0a0e17; border: 1px solid #1e293b; border-radius: 4px; margin-bottom: 4px; }
        .medication-item button, .lab-item button { background: none; border: none; color: #f87171; cursor: pointer; font-size: 16px; margin-left: auto; }
        .medication-add, .lab-add { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .medication-add input, .lab-add input { flex: 1; min-width: 80px; padding: 6px 10px; background: #0a0e17; border: 1px solid #1e293b; border-radius: 6px; color: #e2e8f0; font-size: 12px; outline: none; }
        .medication-add select { padding: 6px 10px; background: #0a0e17; border: 1px solid #1e293b; border-radius: 6px; color: #e2e8f0; font-size: 12px; outline: none; }
        #history-list { display: flex; flex-direction: column; gap: 8px; }
        .history-item { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 12px 16px; cursor: pointer; transition: border-color 0.2s; }
        .history-item:hover { border-color: #06b6d4; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .metric-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; padding: 14px; text-align: center; }
        .metric-label { display: block; font-size: 11px; text-transform: uppercase; color: #64748b; letter-spacing: 0.5px; }
        .metric-value { font-family: monospace; font-size: 22px; font-weight: 700; color: #22d3ee; }
        #case-logs { background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; padding: 16px; overflow-x: auto; }
        #case-logs table { width: 100%; border-collapse: collapse; font-size: 12px; }
        #case-logs th { text-align: left; padding: 6px 10px; color: #64748b; font-weight: 600; border-bottom: 1px solid #1e293b; }
        #case-logs td { padding: 6px 10px; border-bottom: 1px solid #0a0e17; }
        @media (max-width: 768px) {
            .app-main { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #1e293b; display: flex; overflow-x: auto; }
            .sidebar button { display: inline-block; width: auto; white-space: nowrap; }
            .control-bar { flex-direction: column; align-items: stretch; }
            .header-right { width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>
<div id="app">
    <header class="app-header">
        <h1>🏥 AIVANA OPD Scribe</h1>
        <div class="header-right">
            <span id="ollama-status">🔄 Checking...</span>
            <span id="user-email" style="color:#e2e8f0;"></span>
            <button id="logout-btn" class="btn-outline">Logout</button>
        </div>
    </header>
    <main class="app-main">
        <aside class="sidebar">
            <button class="active" data-view="scribe">📝 Scribe</button>
            <button data-view="history">📋 History</button>
            <button data-view="observability">📊 Metrics</button>
        </aside>
        <section class="content">
            <div id="scribe-view" class="view active">
                <div class="control-bar">
                    <button id="start-consult-btn" class="btn-primary">🎤 Start Consultation</button>
                    <button id="stop-consult-btn" class="btn-danger" style="display:none;">⏹ Stop</button>
                    <span id="mic-status" class="idle">Idle</span>
                    <label><input type="checkbox" id="live-mode" checked /> Live Mode</label>
                    <select id="print-language">
                        <option value="English">English</option>
                        <option value="Hindi">Hindi</option>
                        <option value="Tamil">Tamil</option>
                        <option value="Telugu">Telugu</option>
                        <option value="Kannada">Kannada</option>
                        <option value="Bengali">Bengali</option>
                        <option value="Marathi">Marathi</option>
                        <option value="Malayalam">Malayalam</option>
                        <option value="Gujarati">Gujarati</option>
                        <option value="Punjabi">Punjabi</option>
                    </select>
                </div>
                <div class="presets">
                    <button class="preset-btn" data-transcript='Doctor: What seems to be the trouble? Patient: I have chest congestion and cough for 4 days. Doctor: Let me check... you have Acute Bronchitis. I\'m prescribing Amoxicillin 500mg thrice daily for 5 days.'>📋 Acute Bronchitis</button>
                    <button class="preset-btn" data-transcript='Doctor: How are you feeling? Patient: Dizzy spells. Doctor: BP is 146/93. You have Hypertension. I\'m starting Telmisartan 40mg once daily.'>📋 Hypertension</button>
                    <button class="preset-btn" data-transcript='Doctor: What\'s the problem? Patient: Burning stomach pain. Doctor: You have GERD. Take Pantoprazole 40mg daily for 14 days.'>📋 GERD</button>
                </div>
                <textarea id="transcript-input" placeholder="Speak or paste transcript here..." rows="4"></textarea>
                <button id="analyze-btn" class="btn-secondary">🔍 Analyze Transcript</button>
                <div id="analysis-status"></div>
                <div class="prescription-draft">
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
                        <h2>📋 Prescription Draft</h2>
                        <div style="display:flex; gap:8px;">
                            <button id="clear-draft-btn" class="btn-outline">Clear</button>
                            <button id="print-btn" class="btn-primary">🖨️ Prepare Rx Sheet</button>
                        </div>
                    </div>
                    <div class="draft-fields">
                        <div><label>Chief Complaint</label><textarea id="chief-complaint"></textarea></div>
                        <div><label>History of Present Illness (HPI)</label><textarea id="hpi"></textarea></div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                            <div><label>Primary Diagnosis</label><input id="primary-diagnosis" /></div>
                            <div><label>Differential Diagnosis</label><input id="differential-diagnosis" /></div>
                        </div>
                        <div>
                            <label>Medications</label>
                            <div id="medications-list"></div>
                            <div class="medication-add">
                                <input id="med-drug" placeholder="Drug Name" />
                                <input id="med-dose" placeholder="Dose" />
                                <input id="med-frequency" placeholder="Frequency" />
                                <select id="med-route"><option>Oral</option><option>IV</option><option>IM</option><option>SubQ</option><option>Topical</option></select>
                                <input id="med-duration" placeholder="Duration" />
                                <button id="add-med-btn" class="btn-secondary">Add</button>
                            </div>
                        </div>
                        <div>
                            <label>Lab Tests</label>
                            <div id="lab-tests-list"></div>
                            <div class="lab-add">
                                <input id="lab-test" placeholder="Test name" />
                                <button id="add-lab-btn" class="btn-secondary">Add</button>
                            </div>
                        </div>
                        <div><label>Advice & Instructions</label><textarea id="advice"></textarea></div>
                    </div>
                </div>
            </div>
            <div id="history-view" class="view">
                <h2>📋 Consultation History</h2>
                <div id="history-list"></div>
            </div>
            <div id="observability-view" class="view">
                <h2>📊 Observability Dashboard</h2>
                <div class="metrics-grid">
                    <div class="metric-card"><span class="metric-label">Total Cases</span><span class="metric-value" id="total-cases">0</span></div>
                    <div class="metric-card"><span class="metric-label">Avg Latency</span><span class="metric-value" id="avg-latency">0s</span></div>
                    <div class="metric-card"><span class="metric-label">Avg Tokens</span><span class="metric-value" id="avg-tokens">0</span></div>
                    <div class="metric-card"><span class="metric-label">Groq</span><span class="metric-value" id="ollama-status-metric">Checking...</span></div>
                </div>
                <div id="case-logs"></div>
            </div>
        </section>
    </main>
</div>
<script>
const API_BASE = '/api';
const accessToken = localStorage.getItem('access_token');
if (!accessToken) {
    window.location.href = '/index.html';
}
let currentUser = null;
let refreshToken = localStorage.getItem('refresh_token') || null;
let isConsulting = false;
let recognition = null;
let accumulatedTranscript = '';
let currentFinal = '';
const transcriptInput = document.getElementById('transcript-input');
const startBtn = document.getElementById('start-consult-btn');
const stopBtn = document.getElementById('stop-consult-btn');
const micStatus = document.getElementById('mic-status');
const analysisStatus = document.getElementById('analysis-status');
const analyzeBtn = document.getElementById('analyze-btn');
async function apiRequest(endpoint, options = {}) {
    const headers = { 'Content-Type': 'application/json', ...options.headers };
    if (accessToken) headers['Authorization'] = `Bearer ${accessToken}`;
    const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
    if (res.status === 401 && refreshToken) {
        const r = await fetch(`${API_BASE}/auth/refresh`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ refresh_token: refreshToken })
        });
        if (r.ok) {
            const data = await r.json();
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('refresh_token', data.refresh_token);
            accessToken = data.access_token;
            refreshToken = data.refresh_token;
            headers['Authorization'] = `Bearer ${data.access_token}`;
            return fetch(`${API_BASE}${endpoint}`, { ...options, headers });
        } else {
            localStorage.clear();
            window.location.href = '/index.html';
        }
    }
    return res;
}
function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id + '-view').classList.add('active');
    document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
    document.querySelector(`.sidebar button[data-view="${id}"]`)?.classList.add('active');
}
async function loadUserInfo() {
    const res = await apiRequest('/auth/me');
    if (res.ok) {
        const data = await res.json();
        currentUser = data.user;
        document.getElementById('user-email').textContent = currentUser.email;
        checkGroqStatus();
        loadConsultations();
        loadMetrics();
    } else {
        localStorage.clear();
        window.location.href = '/index.html';
    }
}
async function checkGroqStatus() {
    try {
        const res = await apiRequest('/health');
        if (res.ok) {
            const data = await res.json();
            const el = document.getElementById('ollama-status');
            const metricEl = document.getElementById('ollama-status-metric');
            if (data.groq_available !== undefined) {
                el.textContent = data.groq_available ? `✅ Groq: ${data.groq_model}` : '❌ Groq not available';
                el.style.color = data.groq_available ? '#34d399' : '#f87171';
                if (metricEl) metricEl.textContent = data.groq_available ? '✅ Connected' : '❌ Disconnected';
            } else {
                el.textContent = '✅ AI Available';
                el.style.color = '#34d399';
            }
        }
    } catch(e) {
        document.getElementById('ollama-status').textContent = '❌ Backend unreachable';
    }
}
function setMicStatus(status, text) {
    micStatus.className = status;
    micStatus.textContent = text;
}
document.getElementById('start-consult-btn').addEventListener('click', () => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        setMicStatus('idle', 'Speech not supported');
        analysisStatus.className = 'error';
        analysisStatus.textContent = '⚠️ Your browser does not support speech recognition. Please type the transcript manually.';
        transcriptInput.placeholder = 'Type transcript here...';
        transcriptInput.disabled = false;
        isConsulting = true;
        startBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';
        transcriptInput.focus();
        return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true })
        .then(() => {
            startSpeechRecognition();
        })
        .catch((err) => {
            console.error('Microphone permission denied:', err);
            setMicStatus('idle', 'Mic blocked');
            analysisStatus.className = 'error';
            analysisStatus.textContent = '⚠️ Microphone access denied. Please allow microphone access or type manually.';
            isConsulting = true;
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';
            transcriptInput.disabled = false;
            transcriptInput.placeholder = 'Type transcript here...';
            transcriptInput.focus();
        });
});
function startSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        setMicStatus('idle', 'Not supported');
        return;
    }
    isConsulting = true;
    startBtn.style.display = 'none';
    stopBtn.style.display = 'inline-block';
    transcriptInput.disabled = false;
    transcriptInput.value = '';
    accumulatedTranscript = '';
    currentFinal = '';
    clearDraft();
    setMicStatus('listening', 'Listening...');
    analysisStatus.className = '';
    analysisStatus.textContent = '🎤 Listening to speech...';
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-IN';
    recognition.onstart = () => {
        setMicStatus('listening', 'Listening...');
    };
    recognition.onresult = (event) => {
        let final = '';
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
            if (event.results[i].isFinal) {
                final += event.results[i][0].transcript + ' ';
            } else {
                interim += event.results[i][0].transcript;
            }
        }
        if (final) {
            currentFinal += final;
            accumulatedTranscript += final;
        }
        const fullText = (accumulatedTranscript + ' ' + currentFinal + ' ' + interim).trim();
        transcriptInput.value = fullText;
        transcriptInput.scrollTop = transcriptInput.scrollHeight;
    };
    recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
        if (event.error === 'not-allowed') {
            setMicStatus('idle', 'Mic blocked');
            analysisStatus.className = 'error';
            analysisStatus.textContent = '⚠️ Microphone access denied. Please allow microphone access or type manually.';
        } else if (event.error === 'network') {
            setMicStatus('idle', 'Network error');
            analysisStatus.className = 'error';
            analysisStatus.textContent = '⚠️ Network error. Please try again.';
        } else {
            setMicStatus('idle', 'Error');
            analysisStatus.className = 'error';
            analysisStatus.textContent = '⚠️ Speech recognition error: ' + event.error;
        }
        if (isConsulting) {
            setTimeout(() => {
                try { recognition.start(); } catch(e) {}
            }, 1000);
        }
    };
    recognition.onend = () => {
        if (isConsulting) {
            try {
                recognition.start();
            } catch(e) {
                console.log('Could not restart recognition:', e);
                setTimeout(() => {
                    if (isConsulting) {
                        try { recognition.start(); } catch(e) {}
                    }
                }, 1000);
            }
        } else {
            setMicStatus('idle', 'Idle');
        }
    };
    try {
        recognition.start();
    } catch(e) {
        console.error('Failed to start recognition:', e);
        setMicStatus('idle', 'Error');
        analysisStatus.className = 'error';
        analysisStatus.textContent = '⚠️ Failed to start speech recognition. Please type manually.';
        transcriptInput.disabled = false;
        transcriptInput.placeholder = 'Type transcript here...';
    }
}
document.getElementById('stop-consult-btn').addEventListener('click', () => {
    isConsulting = false;
    stopBtn.style.display = 'none';
    startBtn.style.display = 'inline-block';
    setMicStatus('idle', 'Stopped');
    if (recognition) {
        try {
            recognition.stop();
        } catch(e) {
            console.error('Error stopping recognition:', e);
        }
        recognition = null;
    }
    const finalText = transcriptInput.value.trim();
    if (finalText.length >= 10) {
        analysisStatus.className = '';
        analysisStatus.textContent = '🔄 Auto-analyzing transcript...';
        analyzeBtn.click();
    } else {
        analysisStatus.className = 'error';
        analysisStatus.textContent = '⚠️ Transcript too short (minimum 10 characters). Please provide more text.';
    }
});
document.getElementById('analyze-btn').addEventListener('click', analyzeTranscript);
document.querySelectorAll('.preset-btn').forEach(b => {
    b.addEventListener('click', () => {
        transcriptInput.value = b.dataset.transcript;
        analyzeTranscript();
    });
});
async function analyzeTranscript() {
    const transcript = transcriptInput.value.trim();
    if (transcript.length < 10) {
        analysisStatus.className = 'error';
        analysisStatus.textContent = '⚠️ Need more text (at least 10 characters)';
        return;
    }
    analysisStatus.className = '';
    analysisStatus.textContent = '🔄 Analyzing with Groq...';
    analyzeBtn.disabled = true;
    try {
        const res = await apiRequest('/scribe', {
            method: 'POST',
            body: JSON.stringify({ transcript })
        });
        const data = await res.json();
        if (!res.ok) {
            analysisStatus.className = 'error';
            analysisStatus.textContent = '❌ Error: ' + (data.detail || 'Failed');
            return;
        }
        populateDraft(data);
        analysisStatus.className = 'success';
        analysisStatus.textContent = '✅ Prescription ready!';
        loadConsultations();
        loadMetrics();
    } catch(e) {
        analysisStatus.className = 'error';
        analysisStatus.textContent = '❌ Network error';
        console.error(e);
    }
    analyzeBtn.disabled = false;
}
function populateDraft(data) {
    document.getElementById('chief-complaint').value = data.chiefComplaint || '';
    document.getElementById('hpi').value = data.hpi || '';
    document.getElementById('primary-diagnosis').value = data.primaryDiagnosis || '';
    document.getElementById('differential-diagnosis').value = data.differentialDiagnosis || '';
    document.getElementById('advice').value = data.advice || '';
    const medList = document.getElementById('medications-list');
    medList.innerHTML = '';
    if (data.medications && data.medications.length > 0) {
        data.medications.forEach((m, i) => {
            const div = document.createElement('div');
            div.className = 'medication-item';
            div.innerHTML = `<span>${i+1}. ${m.drugName || 'Unknown'} - ${m.dose || 'N/A'} - ${m.frequency || 'N/A'} - ${m.route || 'N/A'} - ${m.duration || 'N/A'}</span>
                <button onclick="this.parentElement.remove()">✕</button>`;
            medList.appendChild(div);
        });
    } else {
        const div = document.createElement('div');
        div.className = 'medication-item';
        div.innerHTML = `<span style="color:#64748b;">No medications found. Add manually below.</span>`;
        medList.appendChild(div);
    }
    const labList = document.getElementById('lab-tests-list');
    labList.innerHTML = '';
    if (data.labTests && data.labTests.length > 0) {
        data.labTests.forEach(t => {
            const div = document.createElement('div');
            div.className = 'lab-item';
            div.innerHTML = `<span>${t}</span><button onclick="this.parentElement.remove()">✕</button>`;
            labList.appendChild(div);
        });
    } else {
        const div = document.createElement('div');
        div.className = 'lab-item';
        div.innerHTML = `<span style="color:#64748b;">No lab tests recommended.</span>`;
        labList.appendChild(div);
    }
}
function clearDraft() {
    ['chief-complaint','hpi','primary-diagnosis','differential-diagnosis','advice'].forEach(id =>
        document.getElementById(id).value = '');
    document.getElementById('medications-list').innerHTML = '';
    document.getElementById('lab-tests-list').innerHTML = '';
}
document.getElementById('clear-draft-btn').addEventListener('click', clearDraft);
document.getElementById('add-med-btn').addEventListener('click', () => {
    const drug = document.getElementById('med-drug').value.trim();
    if (!drug) { alert('Enter drug name'); return; }
    const dose = document.getElementById('med-dose').value || 'N/A';
    const freq = document.getElementById('med-frequency').value || 'N/A';
    const route = document.getElementById('med-route').value;
    const dur = document.getElementById('med-duration').value || 'N/A';
    const list = document.getElementById('medications-list');
    if (list.children.length === 1 && list.children[0].querySelector('span')?.textContent.includes('No medications')) {
        list.innerHTML = '';
    }
    const div = document.createElement('div');
    div.className = 'medication-item';
    div.innerHTML = `<span>${list.children.length+1}. ${drug} - ${dose} - ${freq} - ${route} - ${dur}</span>
        <button onclick="this.parentElement.remove()">✕</button>`;
    list.appendChild(div);
    ['med-drug','med-dose','med-frequency','med-duration'].forEach(id => document.getElementById(id).value = '');
});
document.getElementById('add-lab-btn').addEventListener('click', () => {
    const test = document.getElementById('lab-test').value.trim();
    if (!test) { alert('Enter test name'); return; }
    const list = document.getElementById('lab-tests-list');
    if (list.children.length === 1 && list.children[0].querySelector('span')?.textContent.includes('No lab tests')) {
        list.innerHTML = '';
    }
    const div = document.createElement('div');
    div.className = 'lab-item';
    div.innerHTML = `<span>${test}</span><button onclick="this.parentElement.remove()">✕</button>`;
    list.appendChild(div);
    document.getElementById('lab-test').value = '';
});
document.getElementById('print-btn').addEventListener('click', () => {
    alert('📄 Print prescription using browser print (Ctrl+P)');
    window.print();
});
async function loadConsultations() {
    try {
        const res = await apiRequest('/consultations?limit=50');
        if (res.ok) {
            const data = await res.json();
            const container = document.getElementById('history-list');
            if (!data.consultations || data.consultations.length === 0) {
                container.innerHTML = '<p style="color:#64748b;">No consultations yet.</p>';
                return;
            }
            container.innerHTML = data.consultations.map(c => `
                <div class="history-item" onclick="loadConsultation(${c.id})">
                    <strong>${c.case_id}</strong> - ${new Date(c.created_at).toLocaleDateString()}
                    <div style="color:#94a3b8;">${c.chief_complaint || 'No complaint'} • ${c.medications_count} meds</div>
                </div>
            `).join('');
        }
    } catch(e) { console.error(e); }
}
async function loadConsultation(id) {
    try {
        const res = await apiRequest(`/consultations/${id}`);
        if (res.ok) {
            const data = await res.json();
            populateDraft(data);
            transcriptInput.value = data.raw_transcript || '';
            showView('scribe');
        }
    } catch(e) { console.error(e); }
}
async function loadMetrics() {
    try {
        const res = await apiRequest('/consultations?limit=100');
        if (res.ok) {
            const data = await res.json();
            const cons = data.consultations || [];
            document.getElementById('total-cases').textContent = cons.length;
            if (cons.length > 0) {
                const avgLatency = cons.reduce((s,c) => s + (c.gemini_latency||0), 0) / cons.length;
                document.getElementById('avg-latency').textContent = avgLatency.toFixed(2) + 's';
                const avgTokens = cons.reduce((s,c) => s + (c.total_tokens||0), 0) / cons.length;
                document.getElementById('avg-tokens').textContent = Math.round(avgTokens);
            }
            const container = document.getElementById('case-logs');
            if (cons.length === 0) {
                container.innerHTML = '<p style="color:#64748b;">No logs</p>';
                return;
            }
            container.innerHTML = `
                <table>
                    <tr><th>Case</th><th>Date</th><th>Diagnosis</th><th>Meds</th><th>Latency</th></tr>
                    ${cons.slice(0,20).map(c => `
                        <tr><td>${c.case_id}</td><td>${new Date(c.created_at).toLocaleDateString()}</td>
                        <td>${c.primary_diagnosis || '—'}</td><td>${c.medications_count}</td>
                        <td>${(c.gemini_latency||0).toFixed(2)}s</td></tr>
                    `).join('')}
                </table>
            `;
        }
    } catch(e) { console.error(e); }
}
document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.clear();
    window.location.href = '/index.html';
});
document.querySelectorAll('.sidebar button').forEach(b => {
    b.addEventListener('click', () => {
        const view = b.dataset.view;
        showView(view);
        if (view === 'history') loadConsultations();
        else if (view === 'observability') loadMetrics();
    });
});
loadUserInfo();
</script>
