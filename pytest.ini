[pytest]
testpaths = tests
python_files = test_*.py
markers =
    llm_integration: hits the real Groq API; skipped unless RUN_LLM_INTEGRATION_TESTS=1 and GROQ_API_KEY is set
    e2e: drives a real headless browser (Playwright) against a live local server; requires `playwright install chromium`, otherwise skipped automatically
filterwarnings =
    ignore::DeprecationWarning
